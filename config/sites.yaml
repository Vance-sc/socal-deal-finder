# Search Query Templates
search_query_template: |
  Search {domain} for businesses matching these criteria:

  FINANCIAL:
  - Annual revenue: $1M - $10M
  - Cash flow/EBITDA: $250K minimum

  LOCATION:
  - States: California (especially Southern California), Arizona, Nevada, New Mexico, Texas
  - Cities: Los Angeles, Orange County, San Diego, Phoenix, Las Vegas

  BUSINESS TYPE:
  - Service-based businesses with recurring or repeat revenue
  - Essential services, B2B services, healthcare, professional services
  - Local market presence with operational upside

  EXCLUDE:
  - Restaurants, franchises, bars, food service
  - Digital-only businesses, e-commerce without services
  - Manufacturing (heavy)

  Focus on listings posted in the last 90 days.

  For each matching business, provide:
  1. Business name (or type if name not disclosed)
  2. Specific location (city, state)
  3. Asking price
  4. Annual revenue
  5. Cash flow/EBITDA/SDE
  6. Business type/industry
  7. Brief description
  8. Direct URL to listing
  9. Why it matches our criteria
  10. Confidence score (0-100%)
